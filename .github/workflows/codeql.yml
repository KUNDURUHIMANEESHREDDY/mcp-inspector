name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript / TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: '/language:${{ matrix.language }}'

      # The PR security check reports severity, but annotations may not be available
      # to review tooling. Emit minimal metadata for open CodeQL alerts across refs.
      - name: Report open CodeQL alert metadata
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          alerts="$(gh api --paginate --jq '.[] | select(.tool.name == "CodeQL") | [.number, .rule.id, (.rule.security_severity_level // "unknown"), (.most_recent_instance.ref // "unknown"), (.most_recent_instance.location.path // "unknown"), ((.most_recent_instance.location.start_line // 0) | tostring), (.rule.description // .rule.name // "No description")] | @tsv' \
            -f state=open \
            -f per_page=100 \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts")"
          if [[ -n "$alerts" ]]; then
            printf '%s\n' "$alerts"
          else
            echo "No open CodeQL alerts returned by the API."
          fi
