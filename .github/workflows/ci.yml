name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks
        run: npm run check
      - name: Unit and integration tests
        run: npm test
      - name: Dedicated compatibility report tests
        run: npm run test:compat
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Dependency-free framing benchmark
        run: node ./bench/framer.js > mcp-inspector-framer-benchmark.json
      - name: MCP SDK end-to-end latency benchmark
        if: matrix.node == '24'
        run: node ./bench/mcp-roundtrip.js > mcp-inspector-benchmark.json
      - name: Generate CycloneDX SBOM
        if: matrix.node == '24'
        run: npm sbom --sbom-format=cyclonedx > mcp-inspector.cdx.json
      - name: Package tested source archive
        if: matrix.node == '24'
        run: git archive --format=zip --prefix=mcp-inspector/ HEAD -o mcp-inspector-light-dashboard.zip
      - name: Upload packaged source archive
        if: matrix.node == '24'
        uses: actions/upload-artifact@v6.0.0
        with:
          name: mcp-inspector-light-dashboard
          path: mcp-inspector-light-dashboard.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification evidence
        if: matrix.node == '24'
        uses: actions/upload-artifact@v6.0.0
        with:
          name: mcp-inspector-verification-evidence
          path: |-
            mcp-inspector.cdx.json
            mcp-inspector-benchmark.json
            mcp-inspector-framer-benchmark.json
          if-no-files-found: error
          retention-days: 30

  windows-smoke:
    name: Windows / Node 22
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks
        run: npm run check
      - name: Unit and integration tests
        run: npm test
      - name: Framing benchmark
        run: node ./bench/framer.js

  required:
    name: required
    if: always()
    needs: [test, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all supported runtime and Windows checks to pass
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
        shell: bash
        run: |
          printf 'Node matrix: %s\nWindows smoke: %s\n' "$MATRIX_RESULT" "$WINDOWS_RESULT"
          printf 'Node matrix: %s\\nWindows smoke: %s\\n' "$MATRIX_RESULT" "$WINDOWS_RESULT"
          test "$MATRIX_RESULT" = success
          test "$WINDOWS_RESULT" = success
