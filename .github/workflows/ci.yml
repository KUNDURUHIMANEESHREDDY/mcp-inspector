name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks
        run: npm run check
      - name: Unit and integration tests
        run: npm test
      - name: Dedicated compatibility report tests
        run: npm run test:compat
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Dependency-free framing benchmark
        run: node ./bench/framer.js > mcp-inspector-framer-benchmark.json
      - name: MCP SDK end-to-end latency benchmark
        if: matrix.node == '24'
        run: node ./bench/mcp-roundtrip.js > mcp-inspector-benchmark.json
      - name: Generate CycloneDX SBOM
        if: matrix.node == '24'
        run: npm sbom --sbom-format=cyclonedx > mcp-inspector.cdx.json
      - name: Package tested source archive
        if: matrix.node == '24'
        run: git archive --format=zip --prefix=mcp-inspector/ HEAD -o mcp-inspector-light-dashboard.zip
      - name: Upload packaged source archive
        if: matrix.node == '24'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mcp-inspector-light-dashboard
          path: mcp-inspector-light-dashboard.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification evidence
        if: matrix.node == '24'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mcp-inspector-verification-evidence
          path: |-
            mcp-inspector.cdx.json
            mcp-inspector-benchmark.json
            mcp-inspector-framer-benchmark.json
          if-no-files-found: error
          retention-days: 30

  windows-smoke:
    name: Windows / Node 22
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks
        run: npm run check
      - name: Unit and integration tests
        run: npm test
      - name: Framing benchmark
        run: node ./bench/framer.js

  browser-e2e:
    name: Browser E2E
    uses: ./.github/workflows/browser-e2e.yml
    permissions:
      contents: read

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  required:
    name: required
    if: always()
    needs: [test, windows-smoke, browser-e2e, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require all supported runtime and Windows checks to pass
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Node matrix: %s\\nWindows smoke: %s\\nBrowser E2E: %s\\nCodeQL: %s\\n' "$MATRIX_RESULT" "$WINDOWS_RESULT" "$BROWSER_E2E_RESULT" "$CODEQL_RESULT"
          test "$MATRIX_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$BROWSER_E2E_RESULT" = success
          test "$CODEQL_RESULT" = success
