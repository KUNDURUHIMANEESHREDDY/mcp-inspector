name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const p = JSON.parse(readFileSync('package.json', 'utf8')); if ('v' + p.version !== process.env.RELEASE_REF) { console.error('Tag does not match package.json version'); process.exit(1); }"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Static checks
        run: npm run check
      - name: Unit, integration, and SDK tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > mcp-inspector.cdx.json
      - name: Build source archive and checksums
        env:
          RELEASE_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          ARCHIVE_VERSION="${RELEASE_REF//\//-}"
          git archive --format=tar.gz --prefix=mcp-inspector/ HEAD -o "mcp-inspector-${ARCHIVE_VERSION}.tar.gz"
          sha256sum "mcp-inspector-${ARCHIVE_VERSION}.tar.gz" mcp-inspector.cdx.json > SHA256SUMS
      - name: Upload verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mcp-inspector-release-assets
          path: |
            mcp-inspector-*.tar.gz
            mcp-inspector.cdx.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: mcp-inspector-release-assets
      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            mcp-inspector-*.tar.gz
            mcp-inspector.cdx.json
            SHA256SUMS
