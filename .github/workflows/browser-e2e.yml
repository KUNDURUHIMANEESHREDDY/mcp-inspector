name: Browser E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-browser:
    name: Chromium dashboard E2E / Node 24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund
      # Pin the browser driver so the installed Chromium revision is reproducible.
      - name: Install pinned Playwright without changing project manifests
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static checks
        run: npm run check
      - name: Run real browser test
        env:
          MCP_INSPECTOR_REQUIRE_BROWSER_E2E: '1'
        run: node --test test/dashboard-browser.e2e.test.js
