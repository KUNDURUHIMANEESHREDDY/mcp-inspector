name: Bootstrap reproducible npm lockfile

on:
  push:
    branches:
      - automation/bootstrap-lockfile-20261024

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lockfile-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Generate and verify committed dependency graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v7.0.1
        with:
          ref: automation/bootstrap-lockfile-20261024
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Generate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean locked installation
        run: npm ci --no-audit --no-fund

      - name: Static checks
        run: npm run check

      - name: Unit and integration tests
        run: npm test

      - name: Dependency audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          status=$?
          echo "AUDIT_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Framing benchmark
        run: node ./bench/framer.js > mcp-inspector-framer-benchmark.json

      - name: MCP SDK end-to-end latency benchmark
        run: node ./bench/mcp-roundtrip.js > mcp-inspector-benchmark.json

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > mcp-inspector.cdx.json

      - name: Retain lockfile and verification evidence
        uses: actions/upload-artifact@v6.0.0
        with:
          name: mcp-inspector-lockfile-bootstrap
          path: |
            package-lock.json
            npm-audit.json
            mcp-inspector.cdx.json
            mcp-inspector-benchmark.json
            mcp-inspector-framer-benchmark.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove bootstrap workflow from proposed change
        run: rm .github/workflows/bootstrap-lockfile.yml

      - name: Commit generated lockfile and workflow cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/bootstrap-lockfile.yml
          git commit -m "build: commit reproducible npm lockfile"
          git push origin HEAD:automation/bootstrap-lockfile-20261024
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --draft --base main --head automation/bootstrap-lockfile-20261024 \
            --title "build: commit reproducible npm lockfile" \
            --body "Generated package-lock.json with Node.js 22/npm on a GitHub-hosted runner. The workflow ran npm ci, static checks, tests, dependency audit, benchmarks, and CycloneDX SBOM generation. Review the attached evidence artifact and any audit findings before merge. This PR intentionally contains the lockfile only; the one-time bootstrap workflow is not retained."

      - name: Fail if high or critical dependency findings exist
        if: env.AUDIT_STATUS != '0'
        run: |
          echo "::error::npm audit reported high/critical findings. The lockfile PR was opened as draft, but must not be merged until findings are triaged."
          exit 1
